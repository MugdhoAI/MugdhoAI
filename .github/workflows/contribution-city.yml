name: Contribution-City

on:
  schedule: # daily 18:30 UTC
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-contribution-city
    steps:
      - uses: actions/checkout@v4
      - name: Generate city SVG
        env:
          CITY_TOKEN: ${{ secrets.CITY_TOKEN }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          export GITHUB_TOKEN="${CITY_TOKEN:-$FALLBACK_TOKEN}"
          python3 tools/contribution-city/generate_city.py --out assets/contribution-city.svg
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --cached --quiet || git commit -m "chore: refresh contribution city"
          git push
